# render.yaml
# Blueprint de Render: define la base de datos y los 2 servicios web.

databases:
  # ============================================================
  #  Base de datos PostgreSQL managed
  # ============================================================
  - name: banca-divisa-db
    plan: free
    databaseName: tasas
    user: banca_user
    region: oregon

services:
  # ============================================================
  #  BOT de Telegram (webhook)
  # ============================================================
  - type: web
    name: banca-divisa-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Token del bot
      - key: BOT_TOKEN
        sync: false

      # Admin inicial (solo primer arranque)
      - key: ADMIN_ID
        sync: false

      # Canal inicial (solo primer arranque)
      - key: CANAL
        value: "@BancaYDivisaVe"

      # PostgreSQL (inyectada por Render)
      - key: DATABASE_URL
        fromDatabase:
          name: banca-divisa-db
          property: connectionString

      # URL PÚBLICA del servicio de tasas + /rates
      # La llenas a mano en el dashboard DESPUÉS del primer deploy.
      # Ejemplo: https://rates-xxxx.onrender.com/rates
      - key: RATES_SERVICE_URL
        sync: false

      # URL PÚBLICA del bot + /webhook
      # La llenas a mano en el dashboard DESPUÉS del primer deploy.
      # Ejemplo: https://bot-njfn.onrender.com
      - key: WEBHOOK_URL
        sync: false

  # ============================================================
  #  Servicio de TASAS (FastAPI)
  # ============================================================
  - type: web
    name: banca-divisa-rates
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # Deja que Render asigne el puerto: $PORT
    startCommand: uvicorn rates_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # PostgreSQL (inyectada por Render)
      - key: DATABASE_URL
        fromDatabase:
          name: banca-divisa-db
          property: connectionString
